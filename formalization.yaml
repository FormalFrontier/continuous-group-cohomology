version: "v0.4"
project:
  name: Continuous group cohomology
  description: >-
    Native continuous group cohomology in low degrees; transfer and compact-group
    degree-one torsion; finite-level Tate deflation, compact exceptional Tate
    groups and diagrams, compact finite-bar homology and norm-limit sequences.
    For compact topological groups with discrete jointly continuous coefficients
    over a topologized ring, every continuous cohomology class lifts from a
    finite open-normal quotient with invariant coefficients. In positive degrees
    a class-dependent quotient order annihilates the class. The native
    open-normal inflation cocone is a filtered colimit in all degrees, including
    zero, with the actual cohomology topology and arbitrary topological-module
    targets. Its equality refinements depend on the classes; no fixed-stage
    injection, uniform bound or closed-boundary-range hypothesis is claimed.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0
sources:
  - title: Native-core continuous group cohomology (original Formal Frontier development)
    type: original-development
    relationship: other
    note: >-
      Original Formal Frontier development, not a separate mathematical paper
      or a source-coverage assertion. Reuses the cited mathlib and finite-group
      Tate interfaces. Attribution and the specific mathematical APIs are
      documented in docs/attribution.md and the linked module guides.
related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4/tree/83abb3e776bdefcbc447a1e44d0debe4010039e5
    relationship: builds-on
  - id: https://github.com/FormalFrontier/finite-group-tate-cohomology/commit/d17f93bbc5b934f8b9f3cf077769a706a901608d
    relationship: builds-on
    note: Released finite-group Tate cohomology dependency, pinned to this commit.
automation:
  methods:
    - method: agent
      framework: Codex CLI
      tool_setup: >-
        Codex CLI assisted Lean proof and documentation development using
        Lake, Lean and mathlib.
  notes: >-
    Proof development and documentation were AI-assisted using Codex CLI.
status:
  scope: >-
    Low-degree continuous cohomology, finite-index transfer, compact-group
    degree-one torsion, classwise finite-quotient lifts and positive-degree
    classwise torsion, and the all-degree native open-normal finite-stage
    colimit (including degree zero and arbitrary topological-module targets).
    The colimit assumes a compact topological group and discrete jointly
    continuous coefficients over a ring with a topology; generic algebraic
    boundaries and transition diagrams need fewer assumptions. Also includes
    finite-level Tate deflation, compact finite-bar homology, compact exceptional
    Tate stages and diagrams, coefficient naturality, norm rows, compact
    full-system limits and restricted universal-norm comparisons under the
    hypotheses of their respective declarations. The algebraic connecting
    sequence has a two-point integer coinduction/sign example with a nonzero
    degree-one connector and separate split degree-zero boundaries. Vanishing
    of middle-coefficient cohomology in adjacent degrees gives a connecting
    isomorphism on the underlying modules in every natural degree, including
    zero, with the existing connector as forward map; vanishing in either
    degree alone gives the corresponding mono or epi conclusion. No continuity
    or topological isomorphism of this general connector is asserted. There is
    no fixed-stage positive-degree injectivity, uniform
    refinement or bound, closed boundary
    range requirement for the native colimit, arbitrary-system inverse-limit
    exactness, general completed continuous Tate theory or source-coverage
    assertion. The initial invariant-coefficient sequence has a natural
    degree-zero cohomology comparison and is exact at its five internal
    underlying-module positions, with no surjectivity claim at the final
    degree-one term or continuity claim for the boundary. Generic invariant
    injection and left exactness live in TopRep with deprecated
    ContinuousCohomology aliases. The examples include a nonzero displayed
    inclusion, a nonsplit boundary and independent coefficient-level
    obstruction witnesses. For an arbitrary topological domain, continuous-map
    postcomposition preserves exactness of coefficient maps when the middle
    space is discrete, and surjectivity when the target space is discrete.
    Over any topological group, coinduction takes an injective, exact and
    surjective coefficient row with discrete middle and target to injective,
    exact and surjective underlying maps, not categorical TopRep exactness.
    See README.md and individual guides for precise boundaries.
