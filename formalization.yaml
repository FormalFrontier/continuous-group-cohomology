version: "v0.4"
project:
  name: Continuous group cohomology
  description: >-
    Native Lean core for continuous cohomology in degrees zero and one,
    degree-one transfer and compact-group torsion, topological quotients,
    finite-group coinvariants and finite-level deflation in Tate degrees -1 and 0
    with nested-normal-subgroup transitivity, compact finite-bar homology and
    functoriality, finite profinite-quotient Tate diagrams, their topological
    limits and coefficient functoriality, and compact Hausdorff additive-group
    limit models, and compact Hausdorff exceptional Tate kernel/quotient
    presentations with continuous finite-level deflation, compact exceptional
    Tate diagrams, additive natural comparisons and compact additive limits,
    continuous coefficient maps on the exceptional stages and limits, and
    functoriality of selected restricted relative-norm systems. Compact finite
    Tate norm rows and their full open-normal inverse-limit sequence identify
    universal norms and a compact Hausdorff additive quotient. Continuous
    coefficient maps on the actual finite-coinvariant limit give naturality of
    all three full-row arrows and the independently descended quotient action
    and its degree-zero-limit natural isomorphism.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0
sources:
  - title: Native-core continuous group cohomology (original Formal Frontier development)
    type: original-development
    relationship: other
    note: >-
      This is original project development, not a fictional publication,
      a claim that every result is new, or a source-coverage decision.
      Existing mathlib and finite-group Tate results are reused. The
      native-core assembly was a scoped preparation using previously accepted
      ordinary mathematical components. The subsequently recovered exceptional
      deflation and transitivity contribution was independently reviewed and
      accepted on 2026-09-26 at c0dae4cfc6d0a5c6065d9a6b7db1941a54b63b26.
      A later continuous degree-one torsion transfer preserves an independently
      reviewed predecessor. At its 2026-09-26 preparation checkpoint, destination
      packaging still required fresh review; exact decisions are recorded separately.
      Exact release and publication decisions belong in their external records;
      neither ordinary code acceptance nor this note establishes source coverage.
      Two compact finite-bar leaves and a direct client were restored from
      the separately reviewed historical candidate b23f9c5237e99c5270fe0e7db0154de918f75daa;
      their later exact combined contribution completed independent review and
      private release on 2026-09-26. The finite Tate diagram, limit and
      coefficient-functoriality files preserve the separately reviewed
      bbd25f08b4bee9095880a15c11d3712541a5c347 predecessor. This later assembly
      still required its own exact review and acceptance at its 2026-09-26
      assembly checkpoint. A later native
      exceptional Tate topology/deflation transfer from the incubator is
      prepared against exact source b5c384ab832eedacfded4240e5a9dc6fa1b57aee.
      At its 2026-09-27 author handoff this destination adaptation was unreviewed;
      the transfer itself is not a source-coverage or publication decision.
      Two subsequent compact exceptional Tate diagram/limit leaves and one native
      client transfer from independently reviewed incubator main
      aa65d3e5c96fbe5ddd6037f7e7b39fe82114ecf2. At its 2026-09-27 author
      handoff this destination transfer was unreviewed; the transfer itself
      is not a source-coverage or release decision.
      Three further accepted incubator coefficient/norm-functoriality leaves
      and their direct clients are transferred from incubator main
      28d4a7eba8c30747eb006156d8aea30e2f6c46a8. At its 2026-09-27 author
      handoff this destination transfer was unreviewed, not an accepted release
      or a source-coverage decision. Exact later review and release decisions
      are recorded separately; its source check uses a different mathlib pin.
      At the 2026-09-27 source-only author-handoff checkpoint, the two compact
      Tate norm producers and direct clients were transferred from then
      code-unaccepted incubator revision e2a5c7e6f255535aedb5b8ed597c13f6c418c8c1.
      The earlier finite row was separately integrated into incubator main;
      the registered norm-limit source union still needed its own full
      native/private-inclusive evidence, predecessor acceptance and maintainer
      integration. At that checkpoint this destination copy also required its
      own changed-pin compatibility, review, audit, acceptance and release gates.
      Later exact decisions are recorded separately; these are historical handoff
      conditions, not current lifecycle claims. No incubator ancestry or
      dependency is imported here.
      At its 2026-09-27 source-only author handoff, the naturality copy came
      from then-unaccepted frozen incubator PR121 revision
      06f99031c7cf284320dc65fcaf787a569a791be4.
      The original implementation, source registrar and destination transfer
      have distinct Task/UID credits in docs/attribution.md. The isolated
      review and private-inclusive source audit covered only their exact
      inputs, not the changed source registration or destination mathlib pin.
      Subsequently, source PR121 passed its own review and checks and was
      accepted and integrated at 06f99031c7cf284320dc65fcaf787a569a791be4
      (CGC #30/53755, #30/53761). Destination PR150 separately passed
      independent review and native547 full-root/client, private-inclusive
      standard-axiom checks, then was accepted and integrated at
      f37e95ea83e8477e84a58e327df7535cb93c12cc (CGC #30/53596,
      #30/53776, #30/53786). Independent final release acceptance and verified
      GitHub publication remain pending. Neither copy nor later release alone
      establishes source correspondence or coverage.
