version: "v0.4"
project:
  name: Continuous group cohomology
  description: >-
    Native Lean core for continuous cohomology in degrees zero and one,
    degree-one transfer and compact-group torsion, topological quotients,
    finite-group coinvariants and finite-level deflation in Tate degrees -1 and 0
    with nested-normal-subgroup transitivity, compact finite-bar homology and
    functoriality, finite profinite-quotient Tate diagrams, their topological
    limits and coefficient functoriality, and compact Hausdorff additive-group
    limit models.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0
sources:
  - title: Native-core continuous group cohomology (original Formal Frontier development)
    type: original-development
    relationship: other
    note: >-
      This is original project development, not a fictional publication,
      a claim that every result is new, or a source-coverage decision.
      Existing mathlib and finite-group Tate results are reused. The
      native-core assembly was a scoped preparation using previously accepted
      ordinary mathematical components. The subsequently recovered exceptional
      deflation and transitivity contribution was independently reviewed and
      accepted on 2026-09-26 at c0dae4cfc6d0a5c6065d9a6b7db1941a54b63b26.
      A later continuous degree-one torsion transfer preserves an independently
      reviewed predecessor. At its 2026-09-26 preparation checkpoint, destination
      packaging still required fresh review; exact decisions are recorded separately.
      Exact release and publication decisions belong in their external records;
      neither ordinary code acceptance nor this note establishes source coverage.
      Two compact finite-bar leaves and a direct client were restored from
      the separately reviewed historical candidate b23f9c5237e99c5270fe0e7db0154de918f75daa;
      their later exact combined contribution completed independent review and
      private release on 2026-09-26. The finite Tate diagram, limit and
      coefficient-functoriality files preserve the separately reviewed
      bbd25f08b4bee9095880a15c11d3712541a5c347 predecessor. This later assembly
      still requires its own exact review and acceptance.
related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4/tree/e37d88a26f3791ed5a93daa1f949af1021b8d103
    relationship: builds-on
  - id: https://github.com/FormalFrontier/finite-group-tate-cohomology/commit/fda003db3d06774f28b47232e8248852ffdbfc0d
    relationship: builds-on
    note: Pinned official private dependency; not a whole-library review or rights determination.
automation:
  methods:
    - method: agent
      framework: Hive Tasks and Codex CLI
      tool_setup: >-
        AI agents developed Lean proofs and documentation with Lake, Lean,
        mathlib and independent agent review of scoped contributions.
  notes: >-
    Authoring was AI-assisted. At the 2026-09-26 preparation checkpoint,
    the earlier native-core packaging did not inherit first-release approval
    from independently reviewed components. Restored finite deflation received
    its own fresh exact-combined-candidate review; no old conditional component
    vote was transferred. Exact-commit decisions are recorded separately.
status:
  scope: >-
    Low-degree continuous cohomology, transfer and compact-group degree-one
    torsion, finite coinvariants and
    finite-level deflation in Tate degrees -1 and 0, compact Hausdorff additive
    finite-bar homology and additive finite Tate comparison in degrees -(n+2).
    Finite profinite-quotient Tate diagrams, categorical topological limits and
    coefficient functoriality use covariant finite deflation; no completed
    continuous Tate comparison or inverse-limit exactness is asserted.
  main_results:
    - declaration: ContinuousCohomology.isAddTorsion_degreeOne
      file: ContinuousGroupCohomology/Torsion.lean
    - declaration: ContinuousGroupCohomology.finiteNegativeOneDeflation_comp
      file: ContinuousGroupCohomology/FiniteDeflationTransitivity.lean
    - declaration: CompHausAddCommGrp.FiniteBar.groupHomologyAddEquivPositive_naturality
      file: ContinuousGroupCohomology/CompactBarFunctoriality.lean
    - declaration: ContinuousGroupCohomology.LevelCompact.tateCohomologyNegativeAddEquivFiniteTate
      file: ContinuousGroupCohomology/CompactNegativeTate.lean
review:
  status: other
  notes: >-
    Earlier accepted development contributions received scoped independent
    reviews. The four recovered files originally had a conditional review on an
    unaccepted predecessor. Fresh Worker-a Task
    hive-request-f139e336e97ab3fe7242e258c5c79f30b9530847 independently approved
    the actual combined c0dae4cfc6d0a5c6065d9a6b7db1941a54b63b26 contribution
    in PR110 review3532, with Beacon acceptance and integration on 2026-09-26.
    At the 2026-09-26 preparation checkpoint, the later compact-group degree-one
    torsion transfer had not yet received independent destination review or
    release acceptance. Later exact-commit decisions are recorded separately.
    Compact finite bars subsequently completed their own exact review and private
    release. PR114 review3578 separately reviewed the finite Tate diagram
    predecessor bbd25f08b4bee9095880a15c11d3712541a5c347. The original
    ordinary-import audit's missing private declarations were corrected by
    explicit full-module audits: 1962 base declarations and 67 diagram/client
    declarations, all using only standard axioms. Historical incomplete outputs
    remain preserved. No predecessor review is transferred automatically to
    this assembly, and none establishes whole-source coverage or approval of
    later release history. At this 2026-09-26 composition checkpoint, final
    acceptance of the combined candidate remains pending.
acknowledgements: >-
  Builds on Lean, mathlib and Formal Frontier's finite-group Tate library;
  original contributor/reviewer roles and the repaired pinned mathlib
  ModuleCat universe-lift attribution are identified in docs/attribution.md.
  Whole-artifact rights and history review remained separate at the
  2026-09-26 preparation checkpoint.
