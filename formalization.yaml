version: "v0.4"
project:
  name: Continuous group cohomology
  description: >-
    Dated 2026-09-30 source-only preparation from then-unaccepted incubator
    F2 2a85016c8451ffe9c441c0fc0a8767d63ac2963e on accepted destination
    D 8c7883a672c6f5d465a40f932df5f9ec65224b08. F2 was subsequently
    accepted in isolation, not as a shared-main integration. Exact destination
    C4 f7cc7b2e0e4ae0c4f18b83d1e5159bbf0a500552 passed its original native
    build and complete standard-axiom audit, received independent destination
    review and Beacon's acceptance, and entered development main on
    2026-09-30 at 13:26:59 UTC. Nine native producer
    modules add all-degree classwise finite-quotient lifting with genuine
    quotient-invariant coefficients and positive-degree class-dependent
    quotient-order annihilation and additive torsion. The eight accompanying
    native examples and guides describe the precise hypotheses and boundaries.
    This accepted development is not an independently reviewed official release,
    official publication or a source-coverage decision.
    The complete previously published library description follows:
    Native Lean core for continuous cohomology in degrees zero and one,
    degree-one transfer and compact-group torsion, topological quotients,
    finite-group coinvariants and finite-level deflation in Tate degrees -1 and 0
    with nested-normal-subgroup transitivity, compact finite-bar homology and
    functoriality, finite profinite-quotient Tate diagrams, their topological
    limits and coefficient functoriality, and compact Hausdorff additive-group
    limit models, and compact Hausdorff exceptional Tate kernel/quotient
    presentations with continuous finite-level deflation, compact exceptional
    Tate diagrams, additive natural comparisons and compact additive limits,
    continuous coefficient maps on the exceptional stages and limits, and
    functoriality of selected restricted relative-norm systems. Compact finite
    Tate norm rows and their full open-normal inverse-limit sequence identify
    universal norms and a compact Hausdorff additive quotient. Continuous
    coefficient maps on the actual finite-coinvariant limit give naturality of
    all three full-row arrows and the independently descended quotient action
    and its degree-zero-limit natural isomorphism.
    Separately, full invariant compact relative-norm limits project precisely
    onto universal norms; restricted universal-norm transitions are surjective,
    and genuine inclusions of chosen closed restricted systems containing them
    induce natural compact additive limit isomorphisms with both projection
    equations, without surjectivity of full or arbitrary restricted transitions.
  authors:
    - Formal Frontier Agents
  license: Apache-2.0
