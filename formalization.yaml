status:
  scope: >-
    Low-degree continuous cohomology, transfer and compact-group degree-one
    torsion, finite coinvariants and
    finite-level deflation in Tate degrees -1 and 0, compact Hausdorff additive
    finite-bar homology and additive finite Tate comparison in degrees -(n+2).
    Compact Hausdorff additive exceptional Tate stages in degrees -1 and 0
    arise as the closed kernel and quotient-by-range of a finite norm;
    continuous coinvariant deflation induces compact maps with additive
    comparisons to algebraic finite Tate deflation. Finite profinite-quotient
    Tate diagrams, categorical topological limits and coefficient functoriality
    use covariant finite deflation. Compact exceptional Tate diagrams give
    degree -1 and 0 closed-kernel/quotient stages, additive natural comparisons
    and limits in compact Hausdorff additive groups with eventual-range projections.
    Level-compact morphisms act continuously on compact exceptional Tate
    stages and limits. Morphisms of chosen restricted systems preserve the
    selected coefficients and their actual compact relative-norm diagrams;
    full and universal-norm systems are functorial without extra preservation.
    The actual compact finite coinvariant/kernel/constant-invariant/quotient
    norm row has both finite-stage exact middle pairs and onto degree-zero
    deflation. Its full open-normal compact inverse-limit sequence has both
    exact middle pairs, injective/onto endpoints, actual universal-norm
    kernel and norm range, compact quotient iso and onto degree-zero limit
    projections. For common-universe R and profinite G, arbitrary LevelCompactRep
    morphisms act on the actual finite-coinvariant diagram and limit, commute
    with the three full-row arrows, preserve the actual closed universal-norm
    subgroup, descend continuously to its quotient and make the existing
    quotient-to-degree-zero-limit iso natural. The R, G, Rep and LevelCompact
    data require no scalar or ambient coefficient topology. No arbitrary
    restricted-system identification, onto coinvariant/kernel transitions,
    general inverse-limit exactness, completed continuous Tate comparison,
    all-degree or arithmetic result is asserted.
