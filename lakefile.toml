name = "continuous-group-cohomology"
version = "0.1.0"
defaultTargets = ["ContinuousGroupCohomology", "CGCExamples"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "finiteGroupTateCohomology"
git = "https://github.com/FormalFrontier/finite-group-tate-cohomology.git"
rev = "d17f93bbc5b934f8b9f3cf077769a706a901608d"

[[lean_lib]]
name = "ContinuousGroupCohomology"

